    <style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}html,body{overscroll-behavior:none;background:#0b0d12;height:100%;margin:0;overflow:hidden}html{touch-action:manipulation;-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%}body{color:#f3ead3;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,Segoe UI,Noto Sans Hebrew,Arial,sans-serif}#game{touch-action:none;-webkit-touch-callout:none;width:100%;height:100%;display:block;position:fixed;inset:0}#hud{pointer-events:none;position:fixed;inset:0}#debug{white-space:pre;text-align:left;background:#00000080;border-radius:4px;margin:0;padding:6px 9px;font:12px/1.45 ui-monospace,Consolas,monospace;position:absolute;top:8px;left:12px}#debug[hidden]{display:none}#status{bottom:calc(10px + env(safe-area-inset-bottom));text-align:center;opacity:.75;text-shadow:0 1px 2px #000;font-size:13px;position:absolute;inset-inline:0}#crosshair{background:#ffffffb3;border-radius:50%;width:6px;height:6px;margin:auto;position:absolute;inset:0;box-shadow:0 0 2px #000}#crosshair[hidden]{display:none}#stamina{opacity:0;background:#00000059;border-radius:2px;width:120px;height:3px;margin-left:-60px;transition:background .4s;position:absolute;bottom:34px;left:50%}#stamina-fill{transform-origin:0;background:#f3ead3bf;border-radius:2px;width:100%;height:100%;transition:background .4s}#stamina.winded #stamina-fill{background:#d67854d9}#hint{top:62%;text-align:center;opacity:0;text-shadow:0 1px 3px #000;font-size:15px;transition:opacity .35s;position:absolute;inset-inline:0}#overlay{text-align:center;cursor:pointer;pointer-events:auto;background:#080a109e;flex-direction:column;justify-content:center;align-items:center;gap:14px;display:flex;position:fixed;inset:0}#overlay[hidden]{display:none}#lang-toggle{font:inherit;color:inherit;cursor:pointer;background:#00000080;border:1px solid #f3ead380;border-radius:6px;padding:6px 14px;font-size:14px;position:absolute;inset-block-start:14px;inset-inline-end:14px}#lang-toggle:hover,#quality-toggle:hover{background:#f3ead32e}#quality-toggle{font:inherit;color:inherit;cursor:pointer;background:#00000080;border:1px solid #f3ead380;border-radius:6px;padding:6px 14px;font-size:14px;position:absolute;inset-block-start:14px;inset-inline-start:14px}#quality-toggle[hidden]{display:none}#camera-toggle{font:inherit;color:inherit;cursor:pointer;background:#00000080;border:1px solid #f3ead380;border-radius:6px;padding:6px 14px;font-size:14px;position:absolute;inset-block-start:56px;inset-inline-start:14px}#camera-toggle:hover{background:#f3ead32e}#camera-toggle[hidden]{display:none}#overlay-title{letter-spacing:.04em;text-shadow:0 2px 12px #000;margin:0;font-size:clamp(40px,9vw,96px)}#overlay-prompt{margin:0;font-size:clamp(18px,3vw,28px)}#overlay-hint{opacity:.7;max-width:60ch;margin:0;font-size:14px}</style>
